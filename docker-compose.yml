# =====================================================================
# MODELROGS Display — passerelle des afficheurs SmallTV
#
#   1. Copier ce fichier sur le serveur, dans un dossier dédié
#   2. Choisir les modules (MODULES) et renseigner leurs blocs
#   3. chmod 600 docker-compose.yml     (il contient les jetons Discord et Plex)
#   4. docker compose up -d
#
# Les réglages personnels (ville, salon vocal, valeurs des pages de cours)
# se font ensuite dans l'interface de l'afficheur.
# NE JAMAIS publier ce fichier une fois les jetons renseignés.
# =====================================================================

services:
  gateway:
    image: ghcr.io/sqweedly/modelrogs-gateway:2
    # Essai de la branche beta (image publiée par Actions → Vérification sur beta) :
    # image: ghcr.io/sqweedly/modelrogs-gateway:beta
    # Vérifie à chaque « docker compose up -d » si une version 2.x plus récente
    # est publiée (sinon, seul « docker compose pull » la télécharge)
    pull_policy: always
    container_name: modelrogs-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Dossier de l'hôte où la passerelle écrit son cache (géocodage, historique
      # BTC). Chemin libre à gauche du « : », par ex. /volume1/docker/modelrogs/cache.
      # Il est créé au besoin et reçoit automatiquement les bons droits au démarrage.
      - ./cache:/cache
      # Facultatif : vos propres icônes pour les pages de cours, prioritaires sur
      # celles de la passerelle. Rangement : devises/EUR.png, actions/AAPL.png,
      # commodities/GC=F.png, crypto/bitcoin.png (nom = valeur saisie sur
      # l'afficheur, majuscules indifférentes). PNG carré, 64 px ou plus, fond
      # transparent. Photos de la page Tesla : tesla/route.jpg, stationnee, branchee,
      # charge (paysage, 480 x 336 ou plus). Pris en compte sans redémarrer.
      # Voir docs/PASSERELLE.md.
      # - ./icones:/icones:ro

    environment:
      TZ: Europe/Paris            # fuseau par défaut (si la ville est introuvable)
      # Propriétaire des fichiers du cache sur l'hôte (10001 par défaut).
      # Mettre son propre compte (commande « id » sur l'hôte) pour les lire facilement.
      # PUID: "1000"
      # PGID: "1000"
      VILLE_DEFAUT: Paris         # si l'afficheur n'envoie pas de ville
      # Diagnostic de bout en bout (docs/PASSERELLE.md, § 11) : "1" journalise chaque
      # requête (durée, étapes, numéro X-Req de l'afficheur), détail sur /debug.
      # Activable aussi sans redémarrer : curl "http://IP_SERVEUR:8080/debug?on=1"
      # DIAGNOSTIC: "1"

      # ---------------------------------------------------------------
      # MODULES ACTIFS — retirer un nom désactive le module.
      # Disponibles : heure, meteo, crypto, actions, indices, devises, commodities, custom, immich,
      # supervision, discord, plex, tesla   (« btc », l'ancien nom de crypto, reste accepté)
      # ---------------------------------------------------------------
      MODULES: heure,meteo,crypto,actions,indices,devises,commodities,custom,immich,supervision,discord,plex

      # --- Module « supervision » (Uptime Kuma) ----------------------
      # Page de statut Kuma : toutes ses sondes sont suivies par l'afficheur
      # (http://kuma:3001/status/modelrogs  ->  slug = modelrogs)
      KUMA_URL: http://192.168.1.10:3001
      KUMA_STATUS_SLUG: modelrogs

      # --- Module « discord » (bot intégré) ---------------------------
      # Jeton : portail développeur Discord > Bot > Reset Token
      # Serveur : mode développeur Discord > clic droit sur le serveur > Copier l'identifiant
      # Le salon vocal se choisit dans l'interface de l'afficheur.
      DISCORD_TOKEN: "colle-ici-le-jeton-du-bot"
      DISCORD_GUILD_ID: "123456789012345678"
      # Accès privilégié « Server Members » : inutile pour l'écran (les pseudos
      # arrivent avec les événements vocaux). "1" seulement si l'option est cochée
      # sur la page du bot ; sinon Discord refuse la connexion.
      DISCORD_MEMBERS_INTENT: "0"

      # --- Module « plex » ---------------------------------------------
      # Adresse du serveur Plex vue depuis la passerelle, et jeton X-Plex-Token
      # d'un compte administrateur (support Plex : « Finding an authentication token »).
      PLEX_URL: http://192.168.1.10:32400
      PLEX_TOKEN: "colle-ici-le-jeton-plex"

      # --- Module « immich » (page Photos) ---------------------------
      # Clé d'API à créer dans Immich (Paramètres du compte > Clés d'API) avec
      # les droits album.read, asset.read, asset.view et memory.read. Source
      # (hasard, favoris, souvenirs, un album) et durée d'affichage : dans
      # l'interface de l'afficheur.
      IMMICH_URL: http://192.168.1.10:2283
      IMMICH_KEY: "colle-ici-la-cle-immich"

      # --- Module « tesla » (page Tesla, données de TeslaMate) ---------
      # Ajouter « tesla » à MODULES. Serveur MQTT de TeslaMate : nom du conteneur
      # s'il est sur le même réseau Docker (voir « networks » plus bas), sinon son
      # adresse IP (port 1883 ouvert dans le compose de TeslaMate).
      # TESLA_MQTT_HOTE: teslamate-mqtt
      # TESLA_MQTT_PORT: "1883"
      # TESLA_MQTT_UTILISATEUR: ""       # vides : serveur sans identifiants (défaut de TeslaMate)
      # TESLA_MQTT_MOT_DE_PASSE: ""
      # TESLA_MQTT_ESPACE: ""            # MQTT_NAMESPACE de TeslaMate, s'il est réglé
      # TESLA_VOITURE: "1"               # n° après « cars/ » dans les sujets de TeslaMate

      # --- Pages de cours : crypto, actions, indices, devises, commodities, custom
      # Tous les prix sont en dollars, sauf les indices (en points). 3 valeurs au plus par page, séparées par
      # des virgules. Valeurs par défaut : celles choisies dans l'interface de
      # l'afficheur passent avant (3 listes + une saisie libre par page).
      CRYPTOS: bitcoin,ethereum         # identifiants CoinGecko (ou symboles : BTC, ETH)
      ACTIONS: AAPL,MC.PA               # symboles Yahoo Finance (Paris : .PA)
      INDICES: FCHI,GSPC                # symboles Yahoo sans « ^ » : FCHI CAC 40, GSPC S&P 500,
                                        # IXIC Nasdaq, DJI Dow Jones, GDAXI DAX, FTSE, STOXX50E,
                                        # N225 Nikkei, HSI Hang Seng, SSMI ; « CAC40 », « SP500 »… acceptés
      DEVISES: EUR,GBP                  # codes ISO, cotés en dollars
      COMMODITIES: GC=F,CL=F            # contrats Yahoo : GC=F or, SI=F argent, HG=F cuivre,
                                        # CL=F pétrole, NG=F gaz, ZW=F blé, ZC=F maïs,
                                        # ZS=F soja, KC=F café, CC=F cacao
      CUSTOM: c:bitcoin,a:TSLA,m:GC=F   # page Custom : 3 valeurs de toutes catégories, préfixées
                                        # c: crypto, a: action, i: indice, d: devise, m: matière
      # Logos des actions : clé publique gratuite Logo.dev (compte « Community »),
      # commence par pk_. Sans clé : logos des grandes actions américaines inclus,
      # sinon une pastille avec le code.
      # LOGO_DEV_TOKEN: "pk_..."
      # COINGECKO_KEY: ""           # clé « Demo » si l'API refuse les requêtes anonymes

    # Durcissement
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:                      # uniquement pour préparer le dossier du cache au
      - CHOWN                     # démarrage, puis quitter root : la passerelle tourne
      - SETUID                    # ensuite sans aucun privilège
      - SETGID
    security_opt:
      - no-new-privileges:true
    # Plafond mémoire (la passerelle consomme ~50 Mo). Désactivé par défaut :
    # sur Raspberry Pi OS et certains NAS, le contrôleur mémoire des cgroups est
    # absent et Docker refuse alors de démarrer (erreur « memory.max: no such file »).
    # mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    # Page Tesla, TeslaMate sur la même machine : joindre aussi son réseau Docker
    # (nom donné par « docker network ls », souvent teslamate_default). TeslaMate
    # doit être démarré avant la passerelle. Décommenter aussi le bloc en fin de fichier.
    # networks: [default, teslamate]

# networks:
#   teslamate:
#     external: true
#     name: teslamate_default
