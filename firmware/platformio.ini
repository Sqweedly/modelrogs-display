; MODELROGS Display — firmware GeekMagic SmallTV (ESP8266 + ST7789 240x240)
;
; IMPORTANT — OTA et découpage de la flash :
;   reprends ici les lignes `board` et `board_build.ldscript` de TON
;   platformio.ini actuel, pour garder exactement le même découpage de la
;   flash qu'aujourd'hui. Les valeurs ci-dessous sont celles d'un SmallTV
;   standard (4 Mo de flash).
;
; Premier flash : par OTA depuis l'interface actuelle (http://192.168.4.1/update),
; avec le fichier .pio/build/smalltv/firmware.bin.gz (compressé, recommandé)

[env:smalltv]
platform = espressif8266@4.2.1          ; cœur Arduino ESP8266 3.1.2
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
extra_scripts = post:tools/gzip_bin.py   ; produit aussi firmware.bin.gz

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1

build_flags =
  -Os
  ; --- Écran : configuration TFT_eSPI du SmallTV (remplace User_Setup.h) ---
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_CS=4
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_SPI_MODE=SPI_MODE3
  -D TFT_RGB_ORDER=1               ; 1 = RGB ; rouge et bleu inversés ? -> 0 (BGR)
  -D TFT_INVERSION_ON=1             ; couleurs en négatif ? -> remplacer par -D TFT_INVERSION_OFF=1
  -D SPI_FREQUENCY=40000000         ; parasites à l'écran ? -> 27000000
  -D SMOOTH_FONT=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1
