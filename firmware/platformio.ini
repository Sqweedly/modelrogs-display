; MODELROGS Display — firmware GeekMagic SmallTV (ESP8266 + ST7789 240x240)
;
; Compilation : `pio run` (ou « Build » dans VS Code + PlatformIO, dossier
; « firmware » ouvert) -> .pio/build/smalltv/firmware.bin et firmware.bin.gz,
; version « dev » (MODELROGS_VERSION=x.y.z pour une autre). Guide complet :
; docs/DEVELOPPEMENT.md.
;
; Découpage de la flash : `board` et `board_build.ldscript` ci-dessous sont
; ceux d'un SmallTV standard (4 Mo, dont 1 Mo de système de fichiers). Si
; l'appareil est déjà mis à jour par /update avec un autre firmware, garder le
; même découpage que ce firmware-là, sinon l'OTA peut échouer.
;
; Les versions officielles sont compilées par GitHub Actions et publiées dans
; les Releases du dépôt.

[env:smalltv]
platform = espressif8266@4.2.1          ; cœur Arduino ESP8266 3.1.2
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
extra_scripts =
  pre:tools/version.py                  ; version depuis MODELROGS_VERSION (sinon « dev »)
  post:tools/gzip_bin.py                ; produit aussi firmware.bin.gz

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1

build_flags =
  -Os
  ; --- Écran : configuration TFT_eSPI du SmallTV (remplace User_Setup.h) ---
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_CS=4
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_SPI_MODE=SPI_MODE3
  -D TFT_RGB_ORDER=1               ; 1 = RGB ; rouge et bleu inversés ? -> 0 (BGR)
  -D TFT_INVERSION_ON=1             ; couleurs en négatif ? -> remplacer par -D TFT_INVERSION_OFF=1
  -D SPI_FREQUENCY=40000000         ; parasites à l'écran ? -> 27000000
  -D SMOOTH_FONT=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1
